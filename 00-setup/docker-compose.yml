services:
  postgres:
    image: postgres:16
    container_name: dw-postgres
    environment:
      POSTGRES_USER: learner
      POSTGRES_PASSWORD: learner   # local learning only, never use in production
      POSTGRES_DB: playground
    ports:
      - "5433:5432"   # host port 5433 (your Mac already has a Homebrew Postgres on 5432)
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
